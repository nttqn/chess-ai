name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # android/ is intentionally not committed to the repo (see .gitignore)
      # so nobody needs Flutter/Android Studio installed locally just to
      # keep this file in sync. We regenerate it fresh on every build, then
      # patch in the AdMob App ID and INTERNET permission it needs.
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.trungchess --project-name chess_app .

      - name: Patch AndroidManifest.xml (AdMob + app label)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -z "${ADMOB_APP_ID}" ]; then
            echo "::warning::ADMOB_APP_ID secret not set — using Google's TEST AdMob App ID. Ads will show as test ads only. Set the ADMOB_APP_ID secret before publishing."
          fi
          sed -i "s#<application#<uses-permission android:name=\"android.permission.INTERNET\"/>\n  <application#" "$MANIFEST"
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${APP_ID}\"/>\n  </application>#" "$MANIFEST"
          sed -i -E 's/android:label="[^"]*"/android:label="Chess with AI"/g' "$MANIFEST"
          cat "$MANIFEST"

      # Android 15 (targetSdk 35+) draws edge-to-edge by default; Play
      # Console's pre-launch report flags apps that don't explicitly handle
      # it ("some users may not see edge-to-edge"). Flutter's own SafeArea
      # widgets already pad content once the native window stops fitting
      # system windows itself (see tool/MainActivity.kt.template).
      - name: Enable edge-to-edge for Android 15
        run: |
          set -e
          MAIN_ACTIVITY=android/app/src/main/kotlin/com/trungchess/chess_app/MainActivity.kt
          cp tool/MainActivity.kt.template "$MAIN_ACTIVITY"
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              if grep -q "^dependencies" "$f"; then
                if [[ "$f" == *.kts ]]; then
                  perl -0777 -pi -e 's/dependencies \{/dependencies {\n    implementation("androidx.core:core-ktx:1.13.1")/' "$f"
                else
                  perl -0777 -pi -e 's/dependencies \{/dependencies {\n    implementation "androidx.core:core-ktx:1.13.1"/' "$f"
                fi
              else
                if [[ "$f" == *.kts ]]; then
                  printf '\ndependencies {\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n' >> "$f"
                else
                  printf '\ndependencies {\n    implementation "androidx.core:core-ktx:1.13.1"\n}\n' >> "$f"
                fi
              fi
              grep -n -A2 'dependencies {' "$f"
            fi
          done

      # Play Games Services (sign-in + leaderboard) needs an app_id string
      # resource (from games-ids.xml, downloaded from Play Console → Play
      # Games Services → Setup and management → Configuration →
      # Credentials) plus two manifest meta-data entries. Without the
      # PLAY_GAMES_APP_ID secret this uses a placeholder — sign-in and
      # leaderboard calls then just fail silently (every call site in
      # lib/game/score_service.dart is wrapped in try/catch) rather than
      # breaking the build.
      - name: Configure Play Games Services
        env:
          PLAY_GAMES_APP_ID: ${{ secrets.PLAY_GAMES_APP_ID }}
        run: |
          set -e
          APP_ID="${PLAY_GAMES_APP_ID:-000000000000}"
          if [ -z "$PLAY_GAMES_APP_ID" ]; then
            echo "::warning::PLAY_GAMES_APP_ID secret not set — Play Games sign-in/leaderboard will silently do nothing until you configure Play Games Services (see README)."
          fi
          mkdir -p android/app/src/main/res/values
          sed -e "s/__APP_ID__/${APP_ID}/" -e "s/__PACKAGE_NAME__/com.trungchess.chess_app/" \
            tool/games-ids.xml.template > android/app/src/main/res/values/games-ids.xml
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.games.APP_ID\" android:value=\"@string/app_id\"/>\n    <meta-data android:name=\"com.google.android.gms.version\" android:value=\"@integer/google_play_services_version\"/>\n  </application>#" "$MANIFEST"
          cat android/app/src/main/res/values/games-ids.xml

      # google_mobile_ads requires minSdk 24+ (and a recent compileSdk).
      # flutter create defaults these to `flutter.minSdkVersion` /
      # `flutter.compileSdkVersion`, which can lag behind what current
      # plugins need, so force explicit values here. Handles both the
      # Groovy (build.gradle) and Kotlin DSL (build.gradle.kts) templates
      # since Flutter has changed the default over time.
      - name: Raise minSdk/compileSdk for plugin compatibility
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Patching $f"
              if [[ "$f" == *.kts ]]; then
                sed -i -E 's/minSdk( )?=.*/minSdk = 24/' "$f"
                sed -i -E 's/compileSdk( )?=.*/compileSdk = 36/' "$f"
              else
                sed -i -E 's/minSdkVersion .*/minSdkVersion 24/' "$f"
                sed -i -E 's/compileSdkVersion .*/compileSdkVersion 36/' "$f"
              fi
              grep -nE 'minSdk|compileSdk' "$f"
            fi
          done

      # Recent AGP versions run R8 much more aggressively and strip
      # androidx.work's WorkDatabase_Impl (only referenced via reflection),
      # which crashes every screen with "Unable to get provider
      # androidx.startup.InitializationProvider" / "Failed to create an
      # instance of androidx.work.impl.WorkDatabase" the moment the app
      # opens on a real device — WorkManager gets pulled in transitively by
      # google_mobile_ads. Rather than leaving shrinking off forever (Play
      # Console flags that as "Low" app optimization), turn it on and add
      # the specific keep rules that avoid the crash.
      - name: Enable release code shrinking (with WorkManager keep rules)
        run: |
          set -e
          cat tool/proguard-rules-extra.pro >> android/app/proguard-rules.pro
          if [ -f android/app/build.gradle.kts ]; then
            perl -0777 -pi -e 's/release \{/release {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts
            grep -n -A5 'release {' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            perl -0777 -pi -e 's/release \{/release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle
            grep -n -A5 'release {' android/app/build.gradle
          fi

      # If the KEYSTORE_BASE64 secret is set, decode the release keystore
      # and wire it into android/app/build.gradle(.kts) as the "release"
      # signingConfig via the standard Flutter key.properties pattern
      # (https://docs.flutter.dev/deployment/android#signing-the-app), so
      # the resulting APK/AAB is signed with a real upload key instead of
      # the debug key Play Store rejects. Without the secret, this is a
      # no-op and the build stays debug-signed (fine for sideload testing,
      # not for a store upload).
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set — building a debug-signed APK/AAB only. Fine for sideloading, NOT acceptable for a Play Store upload."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          node tool/patch_signing.js
          grep -n -A5 'signingConfigs' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      # Reads assets/icon/icon.png and writes it into every
      # android/app/src/main/res/mipmap-*/ launcher icon slot. Must run
      # after "Generate Android platform project" (needs android/ to
      # exist) and after "Install dependencies" (needs the package itself).
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # PLAY_GAMES_ACHIEVEMENT_IDS is one comma-separated secret, fixed
      # order: first win, 10 wins, 5-win streak, an Expert-difficulty win.
      # Leave it unset (or an entry blank) to skip that achievement — see
      # lib/game/score_service.dart's PlayGamesConfig.
      - name: Build release APK
        env:
          PLAY_GAMES_LEADERBOARD_ID: ${{ secrets.PLAY_GAMES_LEADERBOARD_ID }}
          PLAY_GAMES_ACHIEVEMENT_IDS: ${{ secrets.PLAY_GAMES_ACHIEVEMENT_IDS }}
        run: |
          LB_ID="${PLAY_GAMES_LEADERBOARD_ID:-REPLACE_ME_LEADERBOARD_ID}"
          flutter build apk --release \
            --dart-define=PLAY_GAMES_LEADERBOARD_ID="$LB_ID" \
            --dart-define=PLAY_GAMES_ACHIEVEMENT_IDS="$PLAY_GAMES_ACHIEVEMENT_IDS"

      # Play Console requires the App Bundle format for new app uploads.
      - name: Build release App Bundle
        env:
          PLAY_GAMES_LEADERBOARD_ID: ${{ secrets.PLAY_GAMES_LEADERBOARD_ID }}
          PLAY_GAMES_ACHIEVEMENT_IDS: ${{ secrets.PLAY_GAMES_ACHIEVEMENT_IDS }}
        run: |
          LB_ID="${PLAY_GAMES_LEADERBOARD_ID:-REPLACE_ME_LEADERBOARD_ID}"
          flutter build appbundle --release \
            --dart-define=PLAY_GAMES_LEADERBOARD_ID="$LB_ID" \
            --dart-define=PLAY_GAMES_ACHIEVEMENT_IDS="$PLAY_GAMES_ACHIEVEMENT_IDS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
